name: link-check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/link-check.mjs'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/link-check.mjs'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

# CWK-058 concurrency. cancel-in-progress: TRUE — reads files and publishes nothing, so a
# superseded run leaves nothing half-done.
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # A REAL GATE, not report-only: no continue-on-error. The tree passed before this
      # workflow existed (0 findings over the scoped files, 9 internal links checked).
      #
      # ENGINE: scripts/link-check.mjs — internal relative links and heading anchors, the
      # anchor rule conformed to GitHub's measured render (CWK-098; see the engine header).
      # It lives outside scripts/lib/, so the plugin build never ships it.
      #
      # SCOPE: every TRACKED .md file except `plugin/**`, the generated dist copy, which
      # would double-report every finding its source already carries. No other exclusion:
      # this room has no tracked fixture docs — the engine's own tests build theirs under
      # os.tmpdir().
      #
      # TWO BELTS, and this step FAILS CLOSED on both:
      # 1. An EMPTY file list exits 1 before the engine runs. A scope filter that ever
      #    yields nothing would otherwise report green having scanned nothing.
      # 2. The ENGINE'S OWN EXIT CODE is LOAD-BEARING: it exits 1 on any finding (and on no
      #    input). The summary-line check after it is a second belt, not the mechanism — it
      #    catches an engine that ever exits 0 while reporting findings.
      # `shell: bash` runs with -eo pipefail. Both belts were red-proven by running this
      # step's script locally before it shipped; the commit that added this file records how.
      - shell: bash
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- '*.md' | grep -zv '^plugin/')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::link-check found NO markdown files to scan -- the scope filter is broken, not the tree"
            exit 1
          fi
          status=0
          out=$(node scripts/link-check.mjs "${files[@]}") || status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::link-check exited $status -- see the findings above"
            exit 1
          fi
          echo "$out" | tail -n 1 | grep -qE '^link-check: 0 finding\(s\)' || {
            echo "::error::link-check exited 0 but its summary does not read 0 findings -- the engine's exit code is broken"
            exit 1
          }
