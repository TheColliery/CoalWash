name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

# CWK-058 concurrency. cancel-in-progress: FALSE — the ONE never-cancel case here, and the
# reason is ATOMICITY, not that it publishes: scorecard.yml uploads a SARIF *and* posts to the
# OpenSSF API, so unlike codeql.yml's atomic upload-or-nothing, a run killed mid-flight can
# leave a PARTIALLY-APPLIED publish. It is also schedule-driven, so overlap is rare and
# queueing costs nothing. Cross-reference codeql.yml above, which cancels TRUE while also
# publishing — a reader who notices the difference should find the reason, not a contradiction.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
