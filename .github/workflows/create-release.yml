name: create-release

# The sole Release creator for a Coal* room that ships NO claude.ai ZIPs (UMB-182). It posts the Release for
# ONE tag, derived from that tag's own CHANGELOG entry, and re-reads it byte for byte. No packaging, no assets.
# A room carries EXACTLY ONE of this file and claude-ai-zips.yml, never both (two workflows creating the same
# Release is the race UMB-162 closed). The resolve, derive, create and re-read steps are the same lines as
# claude-ai-zips.yml's; scripts/template-workflows.test.mjs in the .github repo holds the two files to that.
#
# TWO WAYS IN, ONE WRITER (UMB-182 posting path; RELEASE-PATTERN.md, "The posting path for a tag that already exists"):
#   1. A stable tag push. The run is the tag's own: its CHANGELOG, its commit.
#   2. A workflow_dispatch run FROM THE DEFAULT BRANCH with a `tag` input naming a tag that already exists. This
#      is the path for a tag cut before its room carried this file (a dispatch run uses the workflow file as it
#      stands on the branch it is run from, so the default branch's copy runs, not the tag's). The tag's own
#      CHANGELOG and tree are checked out beside the default branch's scripts; the Release is derived from the
#      tag, never from the branch. `launch_form` posts ONE pre-release tag as the repository's launch-form Release
#      (prerelease: true, never Latest), and only while the repository has no stable
#      Release. A newer pre-release tag re-points that ONE Release (draft, empty its assets, move its tag) instead of staying tag-only.
# A person never POSTs a Release by hand: a Release that is missing for an existing tag is posted by this machine.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "An EXISTING tag (vX.Y.Z) to post the Release for, from that tag's own CHANGELOG entry. Run this workflow from the default branch."
        required: true
        type: string
      launch_form:
        description: "Post ONE pre-release tag (vX.Y.Z-label) as the launch-form Release (prerelease: true). Refused for a stable tag, and once the repository has a stable Release. A newer pre-release tag re-points the one launch-form Release."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# cancel-in-progress: FALSE -- this job writes a Release; a run killed mid-write can leave a
# Release whose title/body was never re-read. Keyed on the tag the run posts (the dispatch input, else the
# pushed tag), because the collision is per-Release.
concurrency:
  group: create-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # testing.md: every run has a finite clock; a room re-sizes this from its own measured suite time
    permissions:
      contents: write # only this job creates or edits the Release
    steps:
      # The `tag` input is untrusted text: it reaches this script ONLY through env, is matched against a strict
      # tag pattern, and is checked against the repository's real tags before anything is checked out or written.
      - name: "Resolve the tag this run posts: a stable tag push, or a dispatch from the default branch for an existing tag (a pre-release tag only as the launch form)"
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LAUNCH: ${{ inputs.launch_form }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          launch=false
          repoint=''
          if [[ "${EVENT}" == "push" ]]; then
            tag="${REF_NAME}"
            if [[ "${REF_TYPE}" != "tag" ]]; then
              out "post=false"; echo "::notice::ref_type is '${REF_TYPE}', not a tag -- no Release to post"; exit 0
            elif [[ "${tag}" == *-* ]]; then
              out "post=false"; echo "::notice::${tag} is a pre-release tag -- Releases are stable-only; the repository's one launch-form Release is posted by a workflow_dispatch run with launch_form"; exit 0
            fi
          else
            tag="${INPUT_TAG}"; launch="${INPUT_LAUNCH}"
            if [[ "${REF_TYPE}" != "branch" || "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "::error::run this workflow from the default branch (${DEFAULT_BRANCH}), not from '${REF_NAME}': the tag to post is the input, never the ref"; exit 1
            fi
            if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::the tag input is not a vX.Y.Z or vX.Y.Z-label tag"; exit 1
            fi
            # GitHub's "get a reference" call for a tag name answers 200 with a LIST when no ref is exactly <name> but some
            # START with it (v1.2.3 against v1.2.30), so this lists by prefix and compares the ref name exactly.
            if ! refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" --jq '.[].ref' 2>/dev/null); then
              echo "::error::could not read this repository's tags from the GitHub API, so whether ${tag} exists is unknown; nothing was posted -- run it again"; exit 1
            fi
            if ! grep -Fxq -- "refs/tags/${tag}" <<< "${refs}"; then
              echo "::error::${tag} is not a tag of this repository -- this path posts a Release for a tag that already exists, it never creates a tag"; exit 1
            fi
            if [[ "${tag}" == *-* ]]; then
              if [[ "${launch}" != "true" ]]; then
                echo "::error::${tag} is a pre-release tag -- Releases are stable-only, except the ONE launch form: run again with launch_form"; exit 1
              fi
              # The launch form is the repository's ONE pre-release Release. A NEWER pre-release tag takes it over (the
              # step "Re-point the launch-form Release" below) while no stable Release exists, and the compare API must
              # say the tag is ahead of the one the Release carries. A re-run for the tag it already carries re-points nothing.
              if ! rels=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null); then
                echo "::error::could not list the repository's Releases"; exit 1
              fi
              others=0; stable=0; old=''
              while IFS= read -r rel; do
                [[ -z "${rel}" || "${rel}" == "${tag}" ]] && continue
                others=$((others + 1)); old="${rel}"
                [[ "${rel}" != *-* ]] && stable=$((stable + 1))
              done <<< "${rels}"
              if [[ "${stable}" != "0" ]]; then
                echo "::error::a stable Release exists, so the launch form is closed: ${tag} stays tag-only"; exit 1
              elif [[ "${others}" != "0" && "${others}" != "1" ]]; then
                echo "::error::the launch form is the repository's ONE pre-release Release; found ${others} Releases of other tags"; exit 1
              elif [[ "${others}" == "1" ]]; then
                if ! [[ "${old}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
                  echo "::error::the launch-form Release carries a tag that is not a vX.Y.Z-label pre-release tag; nothing was changed"; exit 1
                fi
                status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${old}...${tag}" --jq .status 2>/dev/null) || status=''
                if [[ "${status}" != "ahead" ]]; then
                  echo "::error::${tag} is not newer than ${old}, the tag the launch-form Release carries (compare says '${status:-unreadable}'); a Release moves forward only"; exit 1
                fi
                repoint="${old}"
              fi
            elif [[ "${launch}" == "true" ]]; then
              echo "::error::launch_form is for a pre-release tag; ${tag} is stable"; exit 1
            fi
          fi
          out "post=true"; out "tag=${tag}"; out "launch=${launch}"; out "repoint=${repoint}"
          echo "posting the Release for ${tag} (launch form: ${launch}${repoint:+, taking over the Release of ${repoint}})"

      # `canon` = the workflow's own commit: the default branch on a dispatch, the tag on a push. Its scripts
      # derive and verify. `tag-src` = the tag's own tree: its CHANGELOG, and for claude-ai-zips.yml its skills.
      - name: Check out the canon scripts (this workflow's own commit)
        if: steps.gate.outputs.post == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes nothing, so the workflow token has no business staying in .git/config for the
          # rest of the job, readable by every later step (SKILL-REPO-PATTERN.md, Layer 5).
          persist-credentials: false
          path: canon

      - name: Check out the tag being posted (its own CHANGELOG and tree)
        if: steps.gate.outputs.post == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.gate.outputs.tag }}
          path: tag-src
          fetch-depth: 0 # the heading-continuity check needs the previous stable tag (git describe)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.post == 'true'
        with:
          node-version: 24

      # UMB-182: the previous stable tag feeds the CHANGELOG heading-continuity check (courier C-2);
      # the current Latest decides make_latest, so a Release for an older tag never takes Latest.
      # A 404 on releases/latest means the repo has no Latest yet; any other failure stops the run,
      # never a guess that could move Latest. The launch form has no previous stable tag.
      - name: Read the previous stable tag and the current Latest release
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TAG: ${{ steps.gate.outputs.tag }}
          POST_LAUNCH: ${{ steps.gate.outputs.launch }}
        run: |
          set -uo pipefail
          prev=''
          if [[ "${POST_LAUNCH}" != "true" ]]; then
            prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${POST_TAG}^" 2>/dev/null || true)
          fi
          if latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>latest-err.txt); then :
          elif grep -q 'HTTP 404' latest-err.txt; then latest=''
          else cat latest-err.txt >&2; echo "::error::could not read the current Latest release"; exit 1; fi
          echo "RELEASE_TAG=${POST_TAG}" >> "$GITHUB_ENV"
          echo "LAUNCH_FORM=${POST_LAUNCH}" >> "$GITHUB_ENV"
          echo "PREVIOUS_STABLE_TAG=${prev}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${latest}" >> "$GITHUB_ENV"
          echo "previous stable tag: ${prev:-none} · current Latest: ${latest:-none}"

      - name: Derive the canon Release title + body from CHANGELOG.md
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        run: node ../canon/scripts/release-notes.mjs

      # A room that adopted this workflow without the script it runs, or kept an older copy of that script, reaches the Release step
      # with a missing file and a gh usage dump. Stop here instead, by name, before any gh release call.
      - name: Check the derive step wrote its four release files (a stale release-notes.mjs stops here)
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        run: |
          for f in release-title.txt release-body.md release-prerelease.txt release-latest.txt; do
            if [[ ! -s "${f}" ]]; then
              echo "::error::the derive step did not write ${f} (or wrote it empty). The scripts/release-notes.mjs this workflow ran is stale or is not the canon's: compare it with the overlay's by blob id (git hash-object scripts/release-notes.mjs) and adopt the whole overlay set (templates/overlay-coal-skill/OVERLAY-README.md). No Release call was made."; exit 1
            fi
          done

      # BB-112 (a), CoalLedger issue 25: the launch-form Release is the repository's ONE pre-release Release, and a newer
      # pre-release tag takes it over, so a repository whose only Release is the launch form can carry the newer tag's
      # ZIPs. The gate found the old tag and proved the new one ahead of it. Order: back to a DRAFT, its assets deleted
      # (the new tag's ZIPs and SHA256SUMS.txt are attached as on a first run, and an old checksum file would make the
      # upload decision refuse), THEN the tag moved. Each call is safe to repeat, so a run that died part-way converges
      # when it is run again. It sits after every build and check above, so a failed build leaves the old Release as it
      # was, and it never publishes: the publish step stays last. This edits a PUBLISHED Release, a path that Immutable Releases
      # closes once the owner switches it on (AR-71 (a1), unsigned today): the launch form is re-decided before that switch.
      - name: Re-point the launch-form Release to this tag (draft it, empty its assets, move its tag), while no stable Release exists
        if: steps.gate.outputs.post == 'true' && steps.gate.outputs.repoint != ''
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TAG: ${{ steps.gate.outputs.repoint }}
        run: |
          set -uo pipefail
          gh release edit "${OLD_TAG}" --draft=true || { echo "::error::could not turn the launch-form Release of ${OLD_TAG} back into a draft; nothing else was changed"; exit 1; }
          assets=$(gh release view "${OLD_TAG}" --json assets --jq '.assets[].name') || { echo "::error::could not list the assets of the launch-form Release of ${OLD_TAG}"; exit 1; }
          while IFS= read -r asset; do
            [[ -z "${asset}" ]] && continue
            gh release delete-asset --yes -- "${OLD_TAG}" "${asset}" || { echo "::error::could not delete ${asset} from the launch-form Release of ${OLD_TAG}"; exit 1; }
          done <<< "${assets}"
          gh release edit "${OLD_TAG}" --tag "${RELEASE_TAG}" --verify-tag || { echo "::error::could not move the launch-form Release from ${OLD_TAG} to ${RELEASE_TAG}"; exit 1; }
          echo "the launch-form Release now carries ${RELEASE_TAG} (a draft until the publish step)"

      # A NEW Release is created as a DRAFT and published only after the byte re-read below (git-workflow.md: a release
      # workflow drafts and publishes last; no asset here, so the re-read is the only thing the draft waits for). A re-run's
      # edit leaves a published Release published. gh finds a draft by its tag name. `--latest` is NOT passed on the draft
      # create (GitHub: a draft cannot be Latest); the publish step applies it.
      - name: Ensure the GitHub Release exists, with the derived canon title + body
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOINTED: ${{ steps.gate.outputs.repoint }}
        run: |
          if [[ -z "${REPOINTED}" ]]; then
            gh release create "${RELEASE_TAG}" --verify-tag --draft --title "$(cat release-title.txt)" --notes-file release-body.md --prerelease="$(cat release-prerelease.txt)" || \
              gh release edit "${RELEASE_TAG}" --title "$(cat release-title.txt)" --notes-file release-body.md --latest="$(cat release-latest.txt)" --prerelease="$(cat release-prerelease.txt)" || \
              { echo "::error::release create failed AND release edit failed -- this is not the expected already-exists race" >&2; exit 1; }
          else
            # the re-point step left the launch-form Release carrying this tag as a draft: edit it, never create a second one
            gh release edit "${RELEASE_TAG}" --title "$(cat release-title.txt)" --notes-file release-body.md --prerelease="$(cat release-prerelease.txt)" || \
              { echo "::error::could not write the derived title and body onto the re-pointed launch-form Release" >&2; exit 1; }
          fi

      - name: Verify the published Release matches the derived title + body (byte-exact re-read)
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${RELEASE_TAG}" --json name,body | node ../canon/scripts/verify-release-shape.mjs

      # Last: the Release goes public only now that its re-read matched (a draft that stays a draft is the loud failure;
      # a published Release with a mangled body is the silent one). `--latest` and `--prerelease` are applied here, because a
      # draft carries neither until it is published.
      - name: Publish the Release last (after its re-read and any assets), and re-read that it is no longer a draft
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${RELEASE_TAG}" --draft=false --latest="$(cat release-latest.txt)" --prerelease="$(cat release-prerelease.txt)"
          state=$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)
          [[ "${state}" == "false" ]] || { echo "::error::${RELEASE_TAG} is still a draft after the publish step" >&2; exit 1; }
