name: CI

on:
  push:
    # main = the assembly line · class-a*/class-b* = supplier benches and their topic
    # branches (hyphen-suffixed: `refs/heads/class-a` exists, so `class-a/<topic>` is a
    # git D/F ref conflict). See the NAMED FLOCK DIVERGENCE note on the gate job below.
    branches: [main, 'class-a*', 'class-b*']
    paths-ignore:
      # skip verify/test only for NON-shipped docs — a SHIPPED markdown artifact (skills/**/SKILL.md, commands/*.md) MUST run CI (verify checks dist-sync)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      # skip verify/test only for NON-shipped docs — a SHIPPED markdown artifact (skills/**/SKILL.md, commands/*.md) MUST run CI (verify checks dist-sync)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }} · node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # NAMED FLOCK DIVERGENCE (CoalWash only — do NOT "conform" this to the siblings):
        # CoalWash is the one repo on the ASSEMBLY-LINE model (see ASSEMBLY-LINE.md) —
        # class-a/class-b are SUPPLIER branches, main is the line. Two tiers of check:
        #   supplier branch = a PART check   -> 3 OS x node 22, tests only
        #   main            = the LINE check -> 3 OS x node 22+24, verify + tests
        # WHY, from a real incident (2026-07-25): 91 Windows failures landed on main in one
        # push and the cause had to be reverse-engineered from logs. Checked at the branch,
        # those failures attach to ONE part. Keeping main's CI clean is what makes a red
        # main traceable at all.
        node: ${{ github.ref == 'refs/heads/main' && fromJSON('[22, 24]') || fromJSON('[22]') }}  # supported LTS only (24 Active, 22 Maintenance); 18/20 are EOL — bump as the Node LTS schedule moves
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
      # Zero-dependency: no install step. Run the same fail-loud gate as a local pre-push,
      # cross-platform. No build step here: rebuilding the dist in CI would mask a stale
      # COMMITTED plugin/ — the exact drift verify exists to catch.
      #
      # verify is ASSEMBLY-ONLY, and skipping it on a supplier branch is CORRECT, not a gap:
      # suppliers commit source + tests and never `plugin/` dist, so dist-vs-source would be
      # red on every supplier push for a right reason — and a branch that is permanently red
      # trains everyone to stop reading red, which costs more than the check is worth.
      # Only the assembled whole has a dist to verify.
      - name: verify (dist == source) — the LINE check, main only
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify.mjs
      - run: node scripts/test.mjs


  # A single STABLE required-check context (the matrix names drift; this does not).
  # Succeeds iff every matrix gate passed or was legitimately skipped; fails if any
  # gate failed. Rulesets require `all-green`, never the per-matrix names.
  all-green:
    name: all-green
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate result
        run: |
          case "${{ needs.gate.result }}" in
            success|skipped) echo "gate ${{ needs.gate.result }}"; exit 0 ;;
            *) echo "gate ${{ needs.gate.result }}"; exit 1 ;;
          esac
